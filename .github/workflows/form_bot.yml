name: Auto Form Submitter

on:
  schedule:
    # 6:00 PM BD Time is 12:00 UTC
    # The * * * means "Every single day"
    # If you want to skip Thursdays again, change the * * * to * * 0,1,2,3,5,6
    - cron: '0 12 * * *'
  
  # This lets you click the manual "Run workflow" button to test it
  workflow_dispatch:

jobs:
  submit-form:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # We only need the 'requests' library for this, no heavy Selenium!
        run: pip install requests

      - name: Run Form Script
        run: python submit_form.py
